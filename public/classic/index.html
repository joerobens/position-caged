<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12100E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Position">
<title>Position — CAGED practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12100E;
  --board:#241E1A;
  --board-edge:#3A302A;
  --bone:#EDE6D8;
  --bone-dim:#948A7D;
  --line:#332B25;
  --shape:#4FC7A1;
  --radius:10px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--bone);
  font-family:var(--display);
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:12px;
  overflow-x:hidden;
}

/* ---------- neck ---------- */
#neck-wrap{
  background:var(--board);border:1px solid var(--board-edge);
  border-radius:14px;padding:6px 4px;position:relative;overflow:hidden;
}
#neck-wrap::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
#neck{display:block;width:100%;height:auto;max-height:46vh}
.dot-txt{font-family:var(--mono);font-size:12px;font-weight:500}
.mark-txt{font-family:var(--mono);font-size:11px;fill:var(--bone-dim)}
.shape-txt{font-family:var(--display);font-size:15px;font-weight:500}
.voice-txt{font-family:var(--display);font-size:14px;font-weight:500}

/* ---------- controls ---------- */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--bone-dim);margin-right:2px}
button{
  font:inherit;font-size:14px;color:var(--bone);
  background:transparent;border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 13px;cursor:pointer;
  touch-action:manipulation;transition:background .12s,border-color .12s,color .12s;
  min-height:40px;
}
button:hover{border-color:var(--bone-dim)}
button.on{background:var(--shape);border-color:var(--shape);color:var(--ink);font-weight:500}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
button[aria-disabled="true"]{opacity:.3;pointer-events:none}
.seg{display:flex;gap:4px;background:#1B1714;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:none;background:transparent;padding:8px 12px;border-radius:8px}
.seg button.on{background:var(--shape)}

/* ---------- practice modes ---------- */
/* The primary control. Bigger than the rest because it is what gets pressed
   one-handed with a guitar on your knee. */
#presets button{font-size:15px;padding:11px 16px;min-height:46px}
#presets button.mod::after{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:currentColor;margin-left:8px;vertical-align:middle;opacity:.75;
}
#gear{margin-left:auto}

#metro-controls{justify-content:space-between;gap:14px}

/* ---------- settings disclosure ---------- */
#settings{
  background:#1B1714;border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;flex-wrap:wrap;gap:14px;
}
#settings .row{gap:6px}
#hint{font-size:12px;color:var(--bone-dim);flex-basis:100%;margin:0}

/* ---------- transport ---------- */
#transport{
  background:#1B1714;border:1px solid var(--line);border-radius:14px;
  padding:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;
}
#play{
  width:70px;height:70px;border-radius:50%;flex:none;
  border:2px solid var(--shape);color:var(--shape);
  display:flex;align-items:center;justify-content:center;padding:0;
}
#play.on{background:var(--shape);color:var(--ink)}
#play svg{width:26px;height:26px;fill:currentColor}
#bpm-box{display:flex;align-items:baseline;gap:8px;flex:none}
#bpm{font-size:56px;font-weight:700;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#bpm-unit{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--bone-dim)}
#bpm-slider{flex:1 1 240px;min-width:180px}
input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:var(--shape);margin-top:-11px;border:none;cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--shape);border:none;cursor:pointer}
#pips{display:flex;gap:8px;flex:none}
.pip{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);transition:transform .06s,background .06s}
.pip.hit{background:var(--shape);border-color:var(--shape);transform:scale(1.45)}
.pip.hit.down{transform:scale(1.75)}
#bars{font-family:var(--mono);font-size:13px;color:var(--bone-dim);flex:none}
#bars b{color:var(--bone);font-weight:500}

/* ---------- misc ---------- */
#legend{font-size:12px;color:var(--bone-dim);line-height:1.6;margin:0}
#legend b{color:var(--bone);font-weight:500}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  #bpm{font-size:44px}
  #play{width:60px;height:60px}
  .lab{width:100%;margin-bottom:-2px}
  #presets button{flex:1 1 42%}
  #gear{margin-left:0;width:100%}
}
/* iPad landscape: the neck can afford more height when the controls sit wide. */
@media (min-width:820px) and (orientation:landscape){
  #neck{max-height:52vh}
}
</style>
</head>
<body>

<div id="neck-wrap"><svg id="neck" role="img" aria-label="Guitar neck showing the current CAGED shape"></svg></div>

<div class="row">
  <span class="lab">Practice</span>
  <span id="presets" class="grp"></span>
  <button id="gear" aria-expanded="false" aria-controls="settings">Settings</button>
</div>

<div class="row"><span class="lab">Key</span><span id="keys" class="grp"></span></div>
<div class="row"><span class="lab">Shape</span><span id="shapes" class="grp"></span></div>
<div class="row" id="setrow"><span class="lab">Strings</span><div class="seg" id="sets"></div></div>
<div class="row" id="scalerow"><span class="lab">Scale</span><span id="scales" class="grp"></span></div>

<div id="transport">
  <button id="play" aria-label="Start metronome"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <div id="bpm-box"><span id="bpm">84</span><span id="bpm-unit">bpm</span></div>
  <input id="bpm-slider" type="range" min="40" max="220" step="1" value="84" aria-label="Tempo">
  <button id="tap">Tap tempo</button>
  <div id="pips" aria-hidden="true"></div>
  <div id="bars">bar <b id="barcount">0</b></div>
</div>

<div class="row" id="metro-controls">
  <div class="grp"><span class="lab">Beats</span>
    <div class="seg" id="beats">
      <button data-b="2">2</button><button data-b="3">3</button>
      <button data-b="4" class="on">4</button><button data-b="6">6</button>
    </div>
  </div>
  <div class="grp"><span class="lab">Move shape every</span>
    <div class="seg" id="adv">
      <button data-a="0" class="on">Off</button><button data-a="2">2 bars</button>
      <button data-a="4">4 bars</button><button data-a="8">8 bars</button>
    </div>
  </div>
  <button id="sound" class="on">Click on</button>
</div>

<div id="settings" class="hide">
  <div class="row"><span class="lab">Layers</span><span id="layers" class="grp"></span></div>
  <div class="row"><span class="lab">Scope</span>
    <div class="seg" id="scope">
      <button data-s="pos" class="on">One position</button>
      <button data-s="all">All five</button>
    </div>
  </div>
  <div class="row"><span class="lab">Labels</span>
    <div class="seg" id="labs">
      <button data-l="deg" class="on">Degrees</button><button data-l="note">Notes</button><button data-l="none">None</button>
    </div>
  </div>
  <p id="hint"></p>
</div>

<p id="legend"></p>

<script>
/* ============================ music data ============================ */
const OPEN=[4,9,2,7,11,4];                     // low E → high e, pitch classes
const MIDI=[40,45,50,55,59,64];                // same strings, open, as MIDI numbers
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const KEYS=["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const DEG=["1","b2","2","b3","3","4","b5","5","b6","6","b7","7"];
const TRIAD=[0,4,7];                           // the chord itself: root, third, fifth

// CAGED shapes: fret offsets per string (null = not played),
// rs/ro = string index + fret offset where the shape's root sits.
const SHAPES={
  C:{f:[null,3,2,0,1,0], rs:1, ro:3, col:"#B48CFF"},
  A:{f:[null,0,2,2,2,0], rs:1, ro:0, col:"#4FC7A1", barre:[1,5]},
  G:{f:[3,2,0,0,0,3],    rs:0, ro:3, col:"#FF8A5B"},
  E:{f:[0,2,2,1,0,0],    rs:0, ro:0, col:"#6FA8FF", barre:[0,5]},
  D:{f:[null,null,0,2,3,2], rs:2, ro:0, col:"#F0C24B"}
};
const SCALES={
  "Chord tones":[0,4,7],
  "Major pent":[0,2,4,7,9],
  "Minor pent":[0,3,5,7,10],
  "Blues":[0,3,5,6,7,10],
  "Mixolydian":[0,2,4,5,7,9,10],
  "Major":[0,2,4,5,7,9,11]
};
// Adjacent three-string sets, low string first.
const SETS={"6-5-4":[0,1,2],"5-4-3":[1,2,3],"4-3-2":[2,3,4],"3-2-1":[3,4,5]};

/* ============================ practice modes ============================ */
/* A preset sets scope and layers together. Six independent toggles is sixty-four
   states and most of them are not worth being in. */
const PRESETS={
  learn:   {name:"Learn the neck", scope:"all", emph:0, layers:{chords:1,scale:0,triads:0,ghosts:0}},
  position:{name:"Position",       scope:"pos", emph:0, layers:{chords:1,scale:1,triads:0,ghosts:0}},
  comping: {name:"Comping",        scope:"pos", emph:0, layers:{chords:0,scale:0,triads:1,ghosts:1}},
  lead:    {name:"Lead",           scope:"pos", emph:1, layers:{chords:1,scale:1,triads:0,ghosts:0}}
};
const LAYERS=[["chords","Chord tones"],["scale","Scale"],["triads","Triads"],["ghosts","Ghosts"]];

/* ============================ state ============================ */
const S=load({
  key:9, shape:0, scale:"Major pent", bpm:84, beats:4, adv:0, labels:"deg", sound:true,
  preset:"position", mod:false, scope:"pos", emph:0, set:"3-2-1",
  layers:{chords:1,scale:1,triads:0,ghosts:0}
});
let seq=[];        // [{name, ref}] ordered up the neck for current key

function load(d){
  try{
    const raw=JSON.parse(localStorage.getItem("caged")||"{}");
    const layers=Object.assign({},d.layers,raw.layers||{});
    delete raw.layers; delete raw.zoom;         // zoom became scope
    Object.assign(d,raw); d.layers=layers;
    if(!PRESETS[d.preset]) d.preset="position";
    if(!SETS[d.set]) d.set="3-2-1";
    if(!SCALES[d.scale]) d.scale="Major pent";
    return d;
  }catch(e){ return d }
}
function save(){try{localStorage.setItem("caged",JSON.stringify(S))}catch(e){}}

// Where each shape sits for a given key root.
function buildSeq(root){
  return Object.keys(SHAPES).map(n=>{
    const s=SHAPES[n];
    let ref=((root-OPEN[s.rs]-s.ro)%12+12)%12;
    return {name:n,ref:ref};
  }).sort((a,b)=>a.ref-b.ref);
}

/* Scope is a separate axis from layers, and the two combinations that produce an
   unreadable neck are simply not reachable: all five positions with a seven note
   scale is ninety dots, and a triad needs one position to be a triad. */
function enforceScope(){
  if(S.scope==="all"){ S.layers.scale=0; S.layers.triads=0; }
}
function applyPreset(id){
  const p=PRESETS[id];
  S.preset=id; S.scope=p.scope; S.emph=p.emph;
  S.layers=Object.assign({},p.layers);
  enforceScope(); syncPreset(); refresh();
}
/* Changing a toggle leaves the preset selected and marks it modified rather than
   silently deselecting it. Returning to the preset's own state clears the mark. */
function syncPreset(){
  const p=PRESETS[S.preset];
  S.mod = !p || S.scope!==p.scope || S.emph!==p.emph ||
    LAYERS.some(([k])=>!!S.layers[k]!==!!p.layers[k]);
}

/* ============================ the note model ============================ */
/* One flat array of records for the visible window, built once. Three overlapping
   layers cannot be drawn as three passes: a fret is frequently a member of all of
   them, and layered passes overdraw each other. Membership first, appearance after. */
function buildNotes(cur){
  const sp=SHAPES[cur.name], ref=cur.ref, root=S.key, iv=SCALES[S.scale];
  const all=S.scope==="all";
  let lo=all?0:Math.max(0,ref-1), hi=all?NF:Math.min(NF,ref+4);

  // Positions the current shape actually frets.
  const grip={};
  for(let s=0;s<6;s++){ if(sp.f[s]===null) continue; const fr=ref+sp.f[s]; if(fr<=NF) grip[s+":"+fr]=1; }

  const tri=S.layers.triads?triadOn(cur):null;
  if(tri&&!all) tri.notes.forEach(n=>{ if(n.f<lo) lo=n.f; if(n.f>hi) hi=n.f; });
  const triKeys={};
  if(tri) tri.notes.forEach(n=>{ triKeys[n.s+":"+n.f]=1; });
  const onSet=SETS[S.set];

  const recs=[];
  for(let s=0;s<6;s++) for(let f=lo;f<=hi;f++){
    const degree=((OPEN[s]+f)-root+120)%12;
    const inScale=iv.indexOf(degree)>=0;
    // Across the whole neck "chord tone" means the degree; inside one position it
    // means this shape is holding it down.
    const inChord=all?TRIAD.indexOf(degree)>=0:grip[s+":"+f]===1;
    const inTriad=triKeys[s+":"+f]===1;
    if(!inScale&&!inChord&&!inTriad) continue;
    recs.push({
      string:s, fret:f, degree:degree,
      inChord:inChord, inScale:inScale, inTriad:inTriad,
      isRoot:degree===0,
      isTopNote:!!(tri&&tri.top.s===s&&tri.top.f===f),
      onSet:onSet.indexOf(s)>=0
    });
  }
  return {recs:recs, lo:lo, hi:hi, tri:tri};
}

/* Triads are CAGED seen through a three string window, so they are read off the
   chord tones around the current shape rather than kept as a table of grips.
   Pick one chord tone per string such that the three degrees are distinct, the
   pitches ascend, and the voicing sits on the shape and stays compact. */
function triadOn(cur){
  const set=SETS[S.set], sp=SHAPES[cur.name], ref=cur.ref, root=S.key;
  // One fret past the box: triad grips often sit just outside the CAGED window,
  // and around the open shapes there is no complete voicing without it.
  const lo=Math.max(0,ref-1), hi=Math.min(NF,ref+5);
  const grip={};
  for(let s=0;s<6;s++){ if(sp.f[s]!==null) grip[s+":"+(ref+sp.f[s])]=1; }

  const cand=set.map(s=>{
    const out=[];
    for(let f=lo;f<=hi;f++){
      const d=((OPEN[s]+f)-root+120)%12;
      if(TRIAD.indexOf(d)>=0) out.push({s:s,f:f,d:d,midi:MIDI[s]+f,grip:grip[s+":"+f]?1:0});
    }
    return out;
  });

  let best=null;
  cand[0].forEach(a=>cand[1].forEach(b=>cand[2].forEach(c=>{
    if(!(a.midi<b.midi&&b.midi<c.midi)) return;          // a voicing, not a cluster
    if(a.d===b.d||b.d===c.d||a.d===c.d) return;          // one root, one third, one fifth
    const span=c.midi-a.midi;
    const near=Math.abs(a.f-ref)+Math.abs(b.f-ref)+Math.abs(c.f-ref);
    const score=(a.grip+b.grip+c.grip)*100-span*2-near;
    if(!best||score>best.score) best={score:score,notes:[a,b,c]};
  })));
  if(!best) return null;

  const n=best.notes, low=n[0], top=n[2];
  // The inversion is whichever degree is lowest in pitch.
  const inv=low.d===0?"root position":low.d===4?"1st inversion":"2nd inversion";
  const short=low.d===0?"root pos":low.d===4?"1st inv":"2nd inv";
  return {notes:n, low:low, top:top, inv:inv, short:short, topDeg:DEG[top.d]};
}

/* One treatment per note, chosen by precedence rather than by draw order.
   A dot has three channels — fill, ring weight, opacity — and four layers do not
   fit into three channels, so the ladder decides. Highest membership wins. */
function styleNote(n,col){
  const L=S.layers, tri=!!L.triads;
  // With triads on, the neck outside the string set is context, not material.
  const claimed=(!tri||n.onSet) &&
    ((L.chords&&n.inChord)||(L.scale&&n.inScale)||(tri&&n.inTriad));
  if(!claimed) return L.ghosts?{ghost:true}:null;
  if(n.isRoot)                return {r:12, fill:col,       stroke:null, sw:0,              txt:"#12100E", op:1};
  if(tri&&n.inTriad&&n.isTopNote)
                              return {r:12, fill:"#241E1A", stroke:col,  sw:4.5,            txt:col,       op:1};
  if(n.inChord||(tri&&n.inTriad))
                              return {r:12, fill:"#241E1A", stroke:col,  sw:S.emph?3:2.5,   txt:col,       op:1};
  return                             {r:11, fill:"#241E1A", stroke:"#5C5044", sw:1,         txt:"#948A7D", op:S.emph?.55:.85};
}

function labelFor(n){
  if(S.labels==="none") return "";
  return S.labels==="deg"?DEG[n.degree]:NAMES[(OPEN[n.string]+n.fret)%12];
}

/* ============================ neck drawing ============================ */
const NX=64,FW=44,NF=15,TY=46,SS=30,VBW=NX+NF*FW+22,VBH=TY+5*SS+48;
const fx=n=>n===0?NX-22:NX+(n-0.5)*FW;
const sy=i=>TY+(5-i)*SS;
const svgEl=document.getElementById("neck");

function drawNeck(){
  const cur=seq[S.shape], sp=SHAPES[cur.name], ref=cur.ref;
  const pos=S.scope==="pos";
  document.documentElement.style.setProperty("--shape",sp.col);

  const model=buildNotes(cur), tri=model.tri;

  // The position box is drawn in both scopes: in all-five it is what tells you
  // which box the metronome has moved you to.
  const boxLo=Math.max(0,ref-1), boxHi=Math.min(NF,ref+4);
  const winX = boxLo===0 ? NX-34 : NX+(boxLo-1)*FW;
  const winR = NX+boxHi*FW;
  const viewLo = pos?model.lo:0, viewHi = pos?model.hi:NF;
  const vX = viewLo===0 ? NX-34 : NX+(viewLo-1)*FW;
  const vR = NX+viewHi*FW;
  const gut  = viewLo===0 ? -28 : vX-34;
  const vb = pos ? [gut, 0, (vR-gut)+16, VBH] : [0,0,VBW,VBH];
  const labX = pos ? gut+14 : 14;

  let g="";
  g+=`<rect x="${winX}" y="${TY-11}" width="${winR-winX}" height="${5*SS+22}" rx="10" fill="${sp.col}" opacity="${pos?.06:.09}"/>`;
  // frets
  for(let f=0;f<=NF;f++){
    const x=NX+f*FW;
    g+=`<line x1="${x}" y1="${TY}" x2="${x}" y2="${TY+5*SS}" stroke="${f===0?'#E4DCCB':'#4A3F37'}" stroke-width="${f===0?5:1.5}" stroke-linecap="round"/>`;
  }
  // strings (thicker toward the low E)
  for(let i=0;i<6;i++){
    g+=`<line x1="${NX}" y1="${sy(i)}" x2="${NX+NF*FW}" y2="${sy(i)}" stroke="#5C5044" stroke-width="${1.6-i*0.14}"/>`;
  }
  // the three string set, when triads are on
  if(tri){
    const set=SETS[S.set];
    g+=`<rect x="${pos?vX:NX-34}" y="${sy(set[2])-13}" width="${(pos?vR:NX+NF*FW)-(pos?vX:NX-34)}" height="${sy(set[0])-sy(set[2])+26}" rx="12" fill="none" stroke="${sp.col}" stroke-opacity=".3" stroke-width="1.5"/>`;
  }
  // inlays
  [3,5,7,9,15].forEach(f=>{ if(f<=NF) g+=`<circle cx="${NX+(f-.5)*FW}" cy="${TY+2.5*SS}" r="4.5" fill="#3E342C"/>`; });
  g+=`<circle cx="${NX+11.5*FW}" cy="${TY+1.5*SS}" r="4.5" fill="#3E342C"/><circle cx="${NX+11.5*FW}" cy="${TY+3.5*SS}" r="4.5" fill="#3E342C"/>`;
  // fret numbers + string names
  for(let f=0;f<=NF;f++){
    if(pos && (f<viewLo||f>viewHi)) continue;
    g+=`<text class="mark-txt" x="${f===0?NX-22:NX+(f-.5)*FW}" y="${TY+5*SS+26}" text-anchor="middle">${f}</text>`;
  }
  ["E","A","D","G","B","e"].forEach((n,i)=>{
    g+=`<text class="mark-txt" x="${labX}" y="${sy(i)+4}" text-anchor="middle">${n}</text>`;
  });
  // muted strings for shapes played from the nut
  if(ref===0){
    for(let s=0;s<6;s++) if(sp.f[s]===null)
      g+=`<text class="mark-txt" x="${NX-20}" y="${sy(s)+4}" text-anchor="middle">×</text>`;
  }
  // barre
  if(sp.barre&&ref>0){
    const y1=sy(sp.barre[1]),y2=sy(sp.barre[0]);
    g+=`<rect x="${fx(ref)-9}" y="${y1-9}" width="18" height="${y2-y1+18}" rx="9" fill="${sp.col}" opacity=".22"/>`;
  }
  // notes
  model.recs.forEach(n=>{
    const st=styleNote(n,sp.col);
    if(!st) return;
    const x=fx(n.fret),y=sy(n.string);
    if(st.ghost){
      g+=`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#5C5044" stroke-width="1" opacity=".15"/>`;
      return;
    }
    g+=`<g opacity="${st.op}">`;
    g+=`<circle cx="${x}" cy="${y}" r="${st.r}" fill="${st.fill}"${st.stroke?` stroke="${st.stroke}" stroke-width="${st.sw}"`:""}/>`;
    const t=labelFor(n);
    if(t) g+=`<text class="dot-txt" x="${x}" y="${y+4}" text-anchor="middle" fill="${st.txt}">${t}</text>`;
    g+=`</g>`;
  });
  // The top note is the one you pick a voicing by, so it is marked above the dot
  // as well as by its ring. Precedence gives the root a solid fill, which would
  // otherwise hide the fact that the root is the note on top.
  if(tri){
    const x=fx(tri.top.f),y=sy(tri.top.s);
    g+=`<path d="M${x-6} ${y-15} L${x} ${y-20} L${x+6} ${y-15}" fill="none" stroke="${sp.col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // headings above the neck
  g+=`<text class="shape-txt" x="${vb[0]+16}" y="${TY-27}" text-anchor="start" fill="${sp.col}">${cur.name} shape${ref===0?" · open":" · fret "+ref}</text>`;
  if(tri) g+=`<text class="voice-txt" x="${vb[0]+vb[2]-16}" y="${TY-27}" text-anchor="end" fill="${sp.col}">${tri.short} · ${tri.topDeg} on top</text>`;

  svgEl.setAttribute("preserveAspectRatio","xMidYMid meet");
  svgEl.setAttribute("viewBox",vb.join(" "));
  svgEl.setAttribute("aria-label",
    `${KEYS[S.key]} major, ${cur.name} shape${ref===0?" at the nut":" at fret "+ref}`+
    (tri?`, triad on strings ${S.set}, ${tri.inv}, ${tri.topDeg} on top`:""));
  svgEl.innerHTML=g;

  drawLegend(cur,tri);
}

function drawLegend(cur,tri){
  const L=S.layers;
  let txt=`<b>${KEYS[S.key]} major</b> · `;
  txt+= S.scope==="all"
    ? `chord tones across the whole neck, <b>${cur.name} shape</b> boxed`
    : `<b>${cur.name} shape</b>${cur.ref===0?" at the nut":`, index finger at fret ${cur.ref}`}`;
  if(tri) txt+=` · triad on <b>${S.set}</b>: <b>${tri.inv}</b>, <b>${tri.topDeg}</b> on top`;
  else if(L.scale) txt+=` · <b>${S.scale.toLowerCase()}</b>`;
  const live=L.chords||L.scale||tri;
  const key=[];
  if(live) key.push("filled dot is the root");
  if(tri) key.push("thick ring is the top note");
  if(L.chords||tri) key.push("ring is a chord tone");
  if(L.scale) key.push("thin ring is the rest of the scale");
  if(live&&L.ghosts) key.push("faint ring is out of play");
  document.getElementById("legend").innerHTML=
    txt+(key.length?". "+key.join(", ")+"."
      :". Every layer is off. Nothing is claiming a note.");
}

/* ============================ chips ============================ */
function chip(text,on,cb,el,extra){
  const b=document.createElement("button");
  b.textContent=text; b.onclick=cb;
  b.setAttribute("aria-pressed",on?"true":"false");
  if(on) b.classList.add("on");
  if(extra) b.classList.add(extra);
  el.appendChild(b); return b;
}
function renderChips(){
  const pc=document.getElementById("presets"); pc.innerHTML="";
  Object.keys(PRESETS).forEach(id=>{
    const on=id===S.preset;
    chip(PRESETS[id].name,on,()=>applyPreset(id),pc,on&&S.mod?"mod":null);
  });

  const kc=document.getElementById("keys"); kc.innerHTML="";
  KEYS.forEach((k,i)=>chip(k,i===S.key,()=>{S.key=i;seq=buildSeq(S.key);S.shape=0;refresh()},kc));

  const sc=document.getElementById("shapes"); sc.innerHTML="";
  seq.forEach((s,i)=>chip(s.name+(s.ref===0?" (open)":" · "+s.ref),i===S.shape,()=>{S.shape=i;refresh()},sc));

  const vc=document.getElementById("scales"); vc.innerHTML="";
  Object.keys(SCALES).forEach(n=>chip(n,n===S.scale,()=>{S.scale=n;refresh()},vc));

  const lc=document.getElementById("layers"); lc.innerHTML="";
  LAYERS.forEach(([k,name])=>{
    const b=chip(name,!!S.layers[k],()=>{
      S.layers[k]=S.layers[k]?0:1;
      if(k==="triads"&&S.layers[k]&&S.scope==="all") S.scope="pos";   // a triad needs a position
      syncPreset(); refresh();
    },lc);
    // Scale and triads are unreachable across all five positions, by design.
    if(S.scope==="all"&&(k==="scale"||k==="triads")) b.setAttribute("aria-disabled","true");
  });

  const stc=document.getElementById("sets"); stc.innerHTML="";
  Object.keys(SETS).forEach(n=>{
    const b=document.createElement("button");
    b.textContent=n; b.setAttribute("aria-pressed",n===S.set?"true":"false");
    if(n===S.set) b.classList.add("on");
    b.onclick=()=>{S.set=n;refresh()};
    stc.appendChild(b);
  });

  document.getElementById("setrow").classList.toggle("hide",!S.layers.triads);
  document.getElementById("scalerow").classList.toggle("hide",!S.layers.scale);
  document.getElementById("hint").textContent = S.scope==="all"
    ? "Across all five positions the neck only shows chord tones. A seven note scale over the whole neck is ninety dots, and a triad needs a single position."
    : "";
}
function segSync(id,attr,val){
  document.querySelectorAll("#"+id+" button").forEach(b=>{
    const on=b.dataset[attr]==String(val);
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on?"true":"false");
  });
}
function refresh(){ enforceScope(); renderChips(); segSync("scope","s",S.scope); segSync("labs","l",S.labels); drawNeck(); save(); }

/* ============================ metronome ============================ */
let ctx=null,playing=false,nextTime=0,beat=0,bar=0,timer=null,queue=[];
const LOOK=.1, TICK=25;

function ensureCtx(){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended") ctx.resume();
}
function click(time,accent){
  if(!S.sound) return;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=accent?1600:900;
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0,time);
  g.gain.linearRampToValueAtTime(accent?.5:.32,time+.001);
  g.gain.exponentialRampToValueAtTime(.0001,time+.05);
  o.start(time); o.stop(time+.06);
}
function schedule(){
  const spb=60/S.bpm;
  while(nextTime < ctx.currentTime+LOOK){
    click(nextTime,beat===0);
    queue.push({beat:beat,bar:bar,t:nextTime});
    beat++;
    if(beat>=S.beats){
      beat=0; bar++;
      if(S.adv && bar%S.adv===0) queue.push({advance:true,t:nextTime+spb});
    }
    nextTime+=spb;
  }
}
function start(){
  ensureCtx();
  playing=true; beat=0; bar=0; queue=[];
  nextTime=ctx.currentTime+.08;
  timer=setInterval(schedule,TICK);
  document.getElementById("play").classList.add("on");
  document.getElementById("play").setAttribute("aria-label","Stop metronome");
  document.getElementById("play").innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  requestWake();
}
function stop(){
  playing=false; clearInterval(timer); queue=[];
  document.getElementById("play").classList.remove("on");
  document.getElementById("play").setAttribute("aria-label","Start metronome");
  document.getElementById("play").innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  document.querySelectorAll(".pip").forEach(p=>p.classList.remove("hit","down"));
  releaseWake();
}
// visual sync runs off the audio clock, not setInterval
function frame(){
  if(playing && ctx){
    // events aren't strictly ordered by time, so take everything that's due
    const due=[];
    queue=queue.filter(e=>{ if(e.t<=ctx.currentTime){ due.push(e); return false; } return true; });
    due.sort((a,b)=>(a.advance?0:1)-(b.advance?0:1));   // move the neck first, then light the beat
    due.forEach(e=>{
      if(e.advance){ S.shape=(S.shape+1)%seq.length; refresh(); return; }
      const pips=document.querySelectorAll(".pip");
      pips.forEach(p=>p.classList.remove("hit","down"));
      if(pips[e.beat]){ pips[e.beat].classList.add("hit"); if(e.beat===0) pips[e.beat].classList.add("down"); }
      document.getElementById("barcount").textContent=e.bar+1;
    });
  }
  requestAnimationFrame(frame);
}
function buildPips(){
  const p=document.getElementById("pips"); p.innerHTML="";
  for(let i=0;i<S.beats;i++){ const d=document.createElement("div"); d.className="pip"; p.appendChild(d); }
}

/* keep the iPad awake while practising */
let wake=null;
async function requestWake(){ try{ if("wakeLock" in navigator) wake=await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wake&&wake.release(); wake=null; }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&playing) requestWake(); });

/* ============================ wiring ============================ */
function setBpm(v){
  S.bpm=Math.min(220,Math.max(40,Math.round(v)));
  document.getElementById("bpm").textContent=S.bpm;
  document.getElementById("bpm-slider").value=S.bpm;
  save();
}
document.getElementById("play").onclick=()=>playing?stop():start();
document.getElementById("bpm-slider").oninput=e=>setBpm(+e.target.value);

let taps=[];
document.getElementById("tap").onclick=()=>{
  const now=performance.now();
  if(taps.length && now-taps[taps.length-1]>2000) taps=[];
  taps.push(now); if(taps.length>5) taps.shift();
  if(taps.length>1){
    let sum=0; for(let i=1;i<taps.length;i++) sum+=taps[i]-taps[i-1];
    setBpm(60000/(sum/(taps.length-1)));
  }
};
document.getElementById("beats").onclick=e=>{
  if(!e.target.dataset.b) return;
  S.beats=+e.target.dataset.b; segSync("beats","b",S.beats); buildPips(); beat=0; save();
};
document.getElementById("adv").onclick=e=>{
  if(e.target.dataset.a===undefined) return;
  S.adv=+e.target.dataset.a; segSync("adv","a",S.adv); save();
};
document.getElementById("scope").onclick=e=>{
  if(!e.target.dataset.s) return;
  S.scope=e.target.dataset.s; syncPreset(); refresh();
};
document.getElementById("labs").onclick=e=>{
  if(!e.target.dataset.l) return;
  S.labels=e.target.dataset.l; refresh();
};
document.getElementById("sound").onclick=e=>{
  S.sound=!S.sound;
  e.target.classList.toggle("on",S.sound);
  e.target.textContent=S.sound?"Click on":"Click off";
  save();
};
document.getElementById("gear").onclick=e=>{
  const panel=document.getElementById("settings");
  const open=panel.classList.toggle("hide")===false;
  e.target.setAttribute("aria-expanded",open?"true":"false");
  e.target.classList.toggle("on",open);
};
const PRESET_KEYS=Object.keys(PRESETS);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); playing?stop():start(); }
  if(e.key==="ArrowUp") setBpm(S.bpm+1);
  if(e.key==="ArrowDown") setBpm(S.bpm-1);
  if(e.key==="ArrowRight"){ S.shape=(S.shape+1)%seq.length; refresh(); }
  if(e.key==="ArrowLeft"){ S.shape=(S.shape+seq.length-1)%seq.length; refresh(); }
  if(e.key>="1"&&e.key<="4") applyPreset(PRESET_KEYS[+e.key-1]);
  if(e.key==="l"||e.key==="L"){
    const order=["deg","note","none"];
    S.labels=order[(order.indexOf(S.labels)+1)%3]; refresh();
  }
});

/* boot */
seq=buildSeq(S.key);
setBpm(S.bpm);
segSync("beats","b",S.beats); segSync("adv","a",S.adv);
document.getElementById("sound").classList.toggle("on",S.sound);
document.getElementById("sound").textContent=S.sound?"Click on":"Click off";
syncPreset();
refresh();
buildPips();
frame();
</script>
</body>
